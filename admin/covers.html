<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>ZibStore — Подбор обложек</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:#0d0b0a;color:#f4f1ed;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{max-width:1400px;margin:0 auto;padding:24px}
    h1{margin:0 0 6px;font-size:28px}
    .muted{color:#9f968f}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
    input,select,button{background:#171311;color:#f4f1ed;border:1px solid #3a312c;border-radius:10px;padding:10px 12px}
    input{min-width:220px}
    button{cursor:pointer}
    button.primary{background:#f3a71b;color:#17100a;border-color:#f3a71b;font-weight:800}
    button.danger{border-color:#70433a}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    .card{background:#14110f;border:1px solid #2c2521;border-radius:16px;overflow:hidden}
    .cover{aspect-ratio:2/3;background:#1a1512;display:flex;align-items:center;justify-content:center;position:relative}
    .cover img{width:100%;height:100%;object-fit:cover}
    .badge{position:absolute;left:10px;top:10px;background:#111d;padding:6px 8px;border-radius:8px;font-size:11px}
    .body{padding:14px}
    .title{font-weight:800;margin-bottom:6px}
    .meta{font-size:12px;color:#aaa;margin-bottom:12px;word-break:break-all}
    .row{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
    .row label{font-size:12px;color:#bdb4ad}
    .row input,.row select{width:100%;min-width:0}
    .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
    .status{font-size:12px;margin-top:8px;min-height:18px}
    .ok{color:#6ee7a8}.err{color:#ff8a8a}
    .hidden{display:none!important}
    .login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}
    .login-box{width:min(420px,100%);background:#14110f;border:1px solid #2c2521;border-radius:18px;padding:24px;box-shadow:0 24px 80px #0008}
    .login-box h1{font-size:24px;margin-bottom:6px}
    .login-box .row{margin-top:14px}
    .login-box input{width:100%;min-width:0}
    .login-box button{width:100%;margin-top:16px}
    .topline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
    .picker-backdrop{position:fixed;inset:0;background:#000b;z-index:1000;display:grid;place-items:center;padding:20px}
    .picker{width:min(1180px,100%);max-height:90vh;overflow:auto;background:#14110f;border:1px solid #44372f;border-radius:18px;padding:18px;box-shadow:0 30px 100px #000}
    .picker-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
    .picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
    .option{background:#0f0d0c;border:1px solid #2c2521;border-radius:14px;overflow:hidden}
    .option.good{border-color:#3d7656}
    .option.ideal{border-color:#6eb98b}
    .option-img{aspect-ratio:2/3;background:#181411;display:grid;place-items:center;overflow:hidden}
    .option-img img{width:100%;height:100%;object-fit:contain;background:#090807}
    .option-body{padding:10px}
    .option-name{font-weight:800;font-size:12px;word-break:break-word}
    .option-meta{font-size:12px;color:#aaa;margin:5px 0}
    .option-status{font-size:12px;margin-bottom:8px}
    .idealText{color:#6ee7a8}.goodText{color:#f7c96b}.badText{color:#ff9a85}
    .option button{width:100%}.option-actions{display:grid;grid-template-columns:1fr auto;gap:6px}.option-actions .mini{width:auto;padding:8px 10px}
    .cover-status{position:absolute;right:10px;top:10px;padding:6px 8px;border-radius:8px;font-size:11px;font-weight:800;background:#111d}
    .cover-status.ok{color:#7ae7a5;border:1px solid #315f42}
    .cover-status.format{color:#ffd06a;border:1px solid #66501f}
    .cover-status.replace{color:#ff9a85;border:1px solid #713d35}
    .source-pill{display:inline-flex;margin-top:6px;padding:3px 7px;border:1px solid #3a312c;border-radius:999px;font-size:11px;color:#bdb4ad}
    .subactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.actions button{width:100%;min-width:0;padding-left:8px;padding-right:8px;white-space:normal}.card{min-width:0}.body{min-width:0}
    .subactions input[type=file]{display:none}
    .hint{font-size:11px;color:#8e847d;margin-top:5px}
    .picker-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}
    .sync-details{margin:12px 0 18px;display:grid;gap:10px}
    .sync-item{background:#14110f;border:1px solid #2c2521;border-radius:14px;padding:12px}
    .sync-item h3{margin:0 0 5px;font-size:14px}
    .sync-candidates{display:grid;gap:7px;margin-top:10px}
    .sync-candidate{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px;border:1px solid #332a25;border-radius:10px;background:#0f0d0c}
    .sync-candidate small{display:block;color:#998f88}
    .steam-tools{margin-top:12px;padding-top:12px;border-top:1px solid #332a25;display:grid;gap:10px}
    .steam-tools-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .steam-results{display:grid;gap:7px}
    .steam-result{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px;border:1px solid #3a312c;border-radius:10px;background:#100e0c}
    .steam-result.recommended{border-color:#527c5d}
    .steam-result small{display:block;color:#998f88;margin-top:2px}
    .steam-result .confidence{color:#6ee7a8;font-weight:800}
    .steam-manual{display:grid;grid-template-columns:150px minmax(180px,1fr) minmax(170px,1fr) auto auto;gap:7px;align-items:center}
    .steam-manual select,.steam-manual input{width:100%;min-width:0}
    .steam-preview{grid-column:1/-1;font-size:12px;color:#bdb4ad;min-height:18px}
    .steam-preview strong{color:#f4f1ed}
    @media (max-width:850px){.steam-manual{grid-template-columns:1fr 1fr}.steam-manual .wide{grid-column:1/-1}.steam-manual button{width:100%}}
  </style>
</head>
<body>
  <section id="loginView" class="login-shell">
    <form id="loginForm" class="login-box">
      <h1>ZibStore Admin</h1>
      <div class="muted">Управление обложками</div>

      <div class="row">
        <label for="username">Логин</label>
        <input id="username" autocomplete="username" required />
      </div>

      <div class="row">
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>

      <button id="loginButton" class="primary" type="submit">Войти</button>
      <div id="loginStatus" class="status"></div>
    </form>
  </section>

  <main id="adminView" class="wrap hidden">
    <div class="topline">
      <div>
        <h1>Управление обложками</h1>
        <div class="muted">Меняй только проблемные позиции. Цена и Steam-сопоставление не затрагиваются.</div>
      </div>
      <button id="logout" class="danger">Выйти</button>
    </div>

    <div class="toolbar">
      <input id="q" placeholder="Поиск по названию / ID" />
      <select id="filter">
        <option value="all">Все</option>
        <option value="problem">Надо проверить</option>
        <option value="format">Не подходит по формату</option>
        <option value="replace">Надо заменить</option>
        <option value="ok">ОК</option>
        <option value="custom">Только custom</option>
        <option value="upload">Только загруженные</option>
        <option value="coverAppId">С coverAppId</option>
        <option value="steam">Только Steam</option>
      </select>
      <button id="reload">Обновить</button>
      <button id="syncDigiseller">Синхронизировать Digiseller</button>
      <span id="syncStatus" class="muted"></span>
    </div>

    <div id="syncDetails" class="sync-details hidden"></div>
    <div id="grid" class="grid"></div>
  </main>

<div id="pickerBackdrop" class="picker-backdrop hidden">
  <div class="picker">
    <div class="picker-head">
      <div>
        <h2 style="margin:0 0 4px">Подбор обложки Steam</h2>
        <div id="pickerInfo" class="muted"></div>
      </div>
      <button id="pickerClose">Закрыть</button>
    </div>
    <div id="pickerStatus" class="status"></div>
    <div class="picker-controls">
      <label><input id="pickerShowAll" type="checkbox"> Показать все допустимые Steam-варианты</label>
      <span class="muted">По умолчанию показываются только вертикальные варианты, подходящие для карточки.</span>
    </div>
    <div id="pickerGrid" class="picker-grid"></div>
  </div>
</div>

<div id="libraryBackdrop" class="picker-backdrop hidden">
  <div class="picker">
    <div class="picker-head">
      <div>
        <h2 style="margin:0 0 4px">Сохранённые обложки</h2>
        <div id="libraryInfo" class="muted"></div>
      </div>
      <button id="libraryClose">Закрыть</button>
    </div>
    <div id="libraryStatus" class="status"></div>
    <div id="libraryGrid" class="picker-grid"></div>
  </div>
</div>

<script>
const API = 'https://api.zibstore.ru';
const TOKEN_KEY = 'zibstore_admin_session';
let token = sessionStorage.getItem(TOKEN_KEY) || '';
let items = [];

function authHeaders(extra = {}) {
  return token ? { ...extra, Authorization: `Bearer ${token}` } : extra;
}

function showLogin(message = '') {
  token = '';
  sessionStorage.removeItem(TOKEN_KEY);
  document.querySelector('#adminView').classList.add('hidden');
  document.querySelector('#loginView').classList.remove('hidden');
  const status = document.querySelector('#loginStatus');
  status.textContent = message;
  status.className = message ? 'status err' : 'status';
}

function showAdmin() {
  document.querySelector('#loginView').classList.add('hidden');
  document.querySelector('#adminView').classList.remove('hidden');
}

async function apiFetch(path, options = {}) {
  const opts = { ...options };
  opts.headers = authHeaders(options.headers || {});
  const res = await fetch(API + path, opts);

  if (res.status === 401) {
    showLogin('Сессия истекла. Войди снова.');
    throw new Error('Unauthorized');
  }

  return res;
}

function coverEndpoint(item){
  if(item.coverMode === 'custom' && item.coverUrl){
    try { return new URL(item.coverUrl, location.origin).toString(); } catch(_) { return item.coverUrl; }
  }

  const u = new URL(API + '/api/cover');
  if(item.coverAppId){
    u.searchParams.set('steamType','app');
    u.searchParams.set('steamId',item.coverAppId);
  }else{
    u.searchParams.set('steamType',item.type === 'package' ? 'package':'app');
    u.searchParams.set('steamId',item.steamId);
  }
  u.searchParams.set('refresh','1');
  return u.toString();
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function visible(item){
  const q = document.querySelector('#q').value.trim().toLowerCase();
  const f = document.querySelector('#filter').value;
  const text = `${item.title} ${item.productId} ${item.steamId} ${item.coverAppId||''}`.toLowerCase();

  if(q && !text.includes(q)) return false;
  if(f === 'problem' && !['format','replace'].includes(item.coverStatus)) return false;
  if(f === 'format' && item.coverStatus !== 'format') return false;
  if(f === 'replace' && item.coverStatus !== 'replace') return false;
  if(f === 'ok' && item.coverStatus !== 'ok') return false;
  if(f === 'custom' && item.coverMode !== 'custom') return false;
  if(f === 'upload' && item.coverSource !== 'upload') return false;
  if(f === 'coverAppId' && !item.coverAppId) return false;
  if(f === 'steam' && item.coverMode === 'custom') return false;
  return true;
}


let pickerContext = null;

function closePicker(){
  pickerContext = null;
  document.querySelector('#pickerBackdrop').classList.add('hidden');
  document.querySelector('#pickerGrid').innerHTML = '';
  document.querySelector('#pickerStatus').textContent = '';
}

function optionStatus(option){
  if(option.ideal) return { text:'✓ Идеально для карточки', cls:'idealText' };
  if(option.suitable) return { text:'✓ Подходит', cls:'goodText' };
  if(option.width < option.height) return { text:'△ Вертикальная, но пропорции отличаются', cls:'goodText' };
  return { text:'✕ Горизонтальная', cls:'badText' };
}

async function openPicker(div,item){
  pickerContext = { div, item };
  const backdrop = document.querySelector('#pickerBackdrop');
  const grid = document.querySelector('#pickerGrid');
  const status = document.querySelector('#pickerStatus');
  const current = readCard(div,item);

  backdrop.classList.remove('hidden');
  grid.innerHTML = '';
  status.textContent = 'Ищу доступные изображения Steam и проверяю их размеры…';
  status.className = 'status';
  document.querySelector('#pickerInfo').textContent =
    `${item.title || item.productId} · ${item.type} ${item.steamId}`;

  try{
    const qs = new URLSearchParams({
      steamType:item.type || 'app',
      steamId:String(item.steamId || '')
    });

    // If a coverAppId is already entered, inspect that AppID instead.
    if(current.coverAppId) qs.set('appId',current.coverAppId);

    const r = await apiFetch('/api/admin/cover-options?' + qs.toString());
    const data = await r.json();
    if(!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);

    const options = data.options || [];
    const showAllBox = document.querySelector('#pickerShowAll');
    showAllBox.checked = false;

    const drawOptions = () => {
      grid.innerHTML = '';
      const showAll = showAllBox.checked;
      const visibleOptions = showAll ? options : options.filter(x => x.recommended);

      status.textContent = visibleOptions.length
        ? `AppID ${data.appId}: показано ${visibleOptions.length} из ${options.length}. Лучшие идут первыми.`
        : `AppID ${data.appId}: вертикальных вариантов подходящего формата не найдено. Можно включить «Показать все».`;

      for(const option of visibleOptions){
      const st = optionStatus(option);
      const el = document.createElement('div');
      el.className = `option ${option.ideal ? 'ideal' : option.suitable ? 'good' : ''}`;
      el.innerHTML = `
        <div class="option-img"><img loading="lazy" alt="" src="${escapeHtml(option.url)}"></div>
        <div class="option-body">
          <div class="option-name">${escapeHtml(option.label)}</div>
          <div class="option-meta">${option.width} × ${option.height} · ratio ${option.ratio}</div>
          <div class="option-status ${st.cls}">${st.text}</div>
          <button class="${option.ideal || option.suitable ? 'primary' : ''}">Выбрать</button>
        </div>
      `;

      el.querySelector('button').onclick = () => {
        const mode = div.querySelector('[data-k="coverMode"]');
        const appIdInput = div.querySelector('[data-k="coverAppId"]');
        const urlInput = div.querySelector('[data-k="coverUrl"]');

        // Exact Steam image URL becomes the selected cover.
        mode.value = 'custom';
        urlInput.value = option.url;
        item.coverSource = 'url';

        // Keep coverAppId only as a search hint; custom URL controls the displayed cover.
        const url = coverEndpoint(readCard(div,item));
        div.querySelector('img').src = url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();

        const cardStatus = div.querySelector('.status');
        cardStatus.textContent = `Выбрано ${option.width}×${option.height}. Нажми «Сохранить».`;
        cardStatus.className = 'status ok';
        closePicker();
      };

        grid.appendChild(el);
      }
    };

    showAllBox.onchange = drawOptions;
    drawOptions();
  }catch(e){
    if(e.message !== 'Unauthorized'){
      status.textContent = e.message;
      status.className = 'status err';
    }
  }
}

document.querySelector('#pickerClose').onclick = closePicker;
document.querySelector('#pickerBackdrop').addEventListener('click',e=>{
  if(e.target.id === 'pickerBackdrop') closePicker();
});


let libraryContext = null;

function closeLibrary(){
  libraryContext = null;
  document.querySelector('#libraryBackdrop').classList.add('hidden');
  document.querySelector('#libraryGrid').innerHTML = '';
  document.querySelector('#libraryStatus').textContent = '';
}

async function openLibrary(div,item){
  libraryContext = { div, item };
  const backdrop = document.querySelector('#libraryBackdrop');
  const grid = document.querySelector('#libraryGrid');
  const status = document.querySelector('#libraryStatus');

  backdrop.classList.remove('hidden');
  grid.innerHTML = '';
  status.textContent = 'Загружаю сохранённые обложки…';
  status.className = 'status';
  document.querySelector('#libraryInfo').textContent = item.title || item.productId;

  try{
    const r = await apiFetch('/api/admin/cover-library');
    const data = await r.json();
    if(!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);

    const covers = data.items || [];
    status.textContent = covers.length
      ? `Сохранено обложек: ${covers.length}`
      : 'Сохранённых обложек пока нет.';

    for(const cover of covers){
      const st = optionStatus(cover);
      const el = document.createElement('div');
      el.className = `option ${cover.ideal ? 'ideal' : cover.suitable ? 'good' : ''}`;
      el.innerHTML = `
        <div class="option-img"><img loading="lazy" alt="" src="${escapeHtml(cover.url)}"></div>
        <div class="option-body">
          <div class="option-name">${escapeHtml(cover.filename)}</div>
          <div class="option-meta">${cover.width} × ${cover.height}</div>
          <div class="option-status ${st.cls}">${st.text}</div>
          <div class="option-actions">
            <button class="primary" data-action="useSaved">Выбрать</button>
            <button class="danger mini" data-action="deleteSaved" title="Удалить сохранённый файл">×</button>
          </div>
        </div>
      `;

      el.querySelector('[data-action="useSaved"]').onclick = async () => {
        try{
          const rr = await apiFetch('/api/admin/use-saved-cover',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({productId:item.productId,filename:cover.filename})
          });
          const saved = await rr.json();
          if(!rr.ok || !saved.ok) throw new Error(saved.error || `HTTP ${rr.status}`);

          Object.assign(item,saved.item,{
            coverStatus:saved.cover.status,
            coverStatusLabel:saved.cover.statusLabel,
            coverWidth:saved.cover.width,
            coverHeight:saved.cover.height,
            coverSource:'saved',
            coverSourceType:'saved'
          });

          div.querySelector('[data-k="coverMode"]').value = 'custom';
          div.querySelector('[data-k="coverUrl"]').value = saved.item.coverUrl;
          div.querySelector('img').src = saved.item.coverUrl + '?_=' + Date.now();

          const cardStatus = div.querySelector('.status');
          cardStatus.textContent = `Выбрана сохранённая обложка ${saved.cover.width}×${saved.cover.height}.`;
          cardStatus.className = 'status ok';
          closeLibrary();
          setTimeout(load,250);
        }catch(e){
          status.textContent = e.message;
          status.className = 'status err';
        }
      };

      el.querySelector('[data-action="deleteSaved"]').onclick = async () => {
        if(!confirm(`Удалить ${cover.filename} с сервера?`)) return;
        try{
          const rr = await apiFetch('/api/admin/delete-saved-cover',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({filename:cover.filename})
          });
          const d = await rr.json();
          if(!rr.ok || !d.ok) throw new Error(d.error || `HTTP ${rr.status}`);
          el.remove();
          status.textContent = 'Сохранённая обложка удалена.';
          status.className = 'status ok';
        }catch(e){
          status.textContent = e.message;
          status.className = 'status err';
        }
      };

      grid.appendChild(el);
    }
  }catch(e){
    if(e.message !== 'Unauthorized'){
      status.textContent = e.message;
      status.className = 'status err';
    }
  }
}

document.querySelector('#libraryClose').onclick = closeLibrary;
document.querySelector('#libraryBackdrop').addEventListener('click',e=>{
  if(e.target.id === 'libraryBackdrop') closeLibrary();
});

function card(item){
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.productId = item.productId;
  div.innerHTML = `
    <div class="cover">
      <span class="badge">${escapeHtml(item.type)} · ${escapeHtml(item.steamId)}</span>
      <span class="cover-status ${escapeHtml(item.coverStatus||'replace')}">${escapeHtml(item.coverStatusLabel||'Проверка')}</span>
      <img alt="" src="${escapeHtml(coverEndpoint(item))}">
    </div>
    <div class="body">
      <div class="title">${escapeHtml(item.title || `Product ${item.productId}`)}</div>
      <div class="meta">Product ID: ${escapeHtml(item.productId)}
        <div class="source-pill">Источник: ${escapeHtml(item.coverSourceType || item.coverSource || 'steam')}</div>
      </div>

      <div class="row">
        <label>Режим</label>
        <select data-k="coverMode">
          <option value="steam" ${item.coverMode!=='custom'?'selected':''}>Steam</option>
          <option value="custom" ${item.coverMode==='custom'?'selected':''}>Custom URL</option>
        </select>
      </div>

      <div class="row">
        <label>coverAppId — AppID только для картинки</label>
        <input data-k="coverAppId" value="${escapeHtml(item.coverAppId||'')}" placeholder="например 3017860">
      </div>

      <div class="row">
        <label>Текущий coverUrl</label>
        <input data-k="coverUrl" value="${escapeHtml(item.coverUrl||'')}" placeholder="Заполняется после выбора/импорта">
      </div>

      <div class="row">
        <label>Внешняя картинка (например IGN)</label>
        <input data-k="externalUrl" placeholder="https://assets-prd.ignimgs.com/...jpg">
        <div class="subactions">
          <button data-action="importUrl">Скачать и применить</button>
        </div>
        <div class="hint">Картинка копируется на твой VPS и дальше не зависит от внешнего CDN.</div>
      </div>

      <div class="row">
        <label>Ручная загрузка</label>
        <div class="subactions">
          <button data-action="chooseFile">Выбрать файл</button>
          <input data-k="file" type="file" accept="image/png,image/jpeg,image/webp,image/avif">
          <span data-k="fileName" class="muted"></span>
        </div>
        <div class="hint">PNG/JPG/WEBP/AVIF, до 12 МБ. Пропорции сохраняются — постер не растягивается.</div>
      </div>

      <div class="actions">
        <button class="primary" data-action="save">Сохранить</button>
        <button data-action="picker">Подобрать</button>
        <button data-action="preview">Превью</button>
        <button data-action="reset">Сбросить на Steam</button>
        <button data-action="saved">Сохранённые</button>
      </div>
      <div class="status"></div>
    </div>
  `;

  const fileInput = div.querySelector('[data-k="file"]');
  const fileName = div.querySelector('[data-k="fileName"]');

  div.querySelector('[data-action="chooseFile"]').onclick = () => fileInput.click();

  fileInput.onchange = () => {
    const file = fileInput.files?.[0];
    fileName.textContent = file ? `${file.name} · ${Math.round(file.size/1024)} КБ` : '';
  };

  div.querySelector('[data-action="importUrl"]').onclick = async () => {
    const sourceUrl = div.querySelector('[data-k="externalUrl"]').value.trim();
    const status = div.querySelector('.status');
    if(!sourceUrl){
      status.textContent = 'Вставь URL картинки.';
      status.className = 'status err';
      return;
    }

    status.textContent = 'Скачиваю и проверяю картинку…';
    status.className = 'status';

    try{
      const r = await apiFetch('/api/admin/import-cover',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({productId:item.productId,url:sourceUrl})
      });
      const data = await r.json();
      if(!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);

      Object.assign(item,data.item,{
        coverStatus:data.cover.status,
        coverStatusLabel:data.cover.statusLabel,
        coverWidth:data.cover.width,
        coverHeight:data.cover.height,
        coverSource:'url',
        coverSourceType:'url'
      });

      div.querySelector('[data-k="coverMode"]').value = 'custom';
      div.querySelector('[data-k="coverUrl"]').value = data.item.coverUrl;
      div.querySelector('img').src = data.item.coverUrl + '?_=' + Date.now();
      status.textContent = `Импортировано ${data.cover.width}×${data.cover.height}: ${data.cover.statusLabel}`;
      status.className = data.cover.status === 'ok' ? 'status ok' : 'status err';
      setTimeout(load, 250);
    }catch(e){
      if(e.message !== 'Unauthorized'){
        status.textContent = e.message;
        status.className = 'status err';
      }
    }
  };

  div.querySelector('[data-action="chooseFile"]').ondblclick = () => {};

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files?.[0];
    if(!file) return;

    const status = div.querySelector('.status');
    if(file.size > 12 * 1024 * 1024){
      status.textContent = 'Файл больше 12 МБ.';
      status.className = 'status err';
      return;
    }

    status.textContent = 'Загружаю картинку…';
    status.className = 'status';

    try{
      const dataUrl = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
        reader.readAsDataURL(file);
      });

      const r = await apiFetch('/api/admin/upload-cover',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({productId:item.productId,dataUrl})
      });
      const data = await r.json();
      if(!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);

      Object.assign(item,data.item,{
        coverStatus:data.cover.status,
        coverStatusLabel:data.cover.statusLabel,
        coverWidth:data.cover.width,
        coverHeight:data.cover.height,
        coverSource:'upload',
        coverSourceType:'upload'
      });

      div.querySelector('[data-k="coverMode"]').value = 'custom';
      div.querySelector('[data-k="coverUrl"]').value = data.item.coverUrl;
      div.querySelector('img').src = data.item.coverUrl + '?_=' + Date.now();
      status.textContent = `Загружено ${data.cover.width}×${data.cover.height}: ${data.cover.statusLabel}`;
      status.className = data.cover.status === 'ok' ? 'status ok' : 'status err';
      setTimeout(load, 250);
    }catch(e){
      if(e.message !== 'Unauthorized'){
        status.textContent = e.message;
        status.className = 'status err';
      }
    }
  });

  div.querySelector('[data-action="reset"]').onclick = async () => {
    const status = div.querySelector('.status');
    status.textContent = 'Возвращаю Steam-обложку…';
    status.className = 'status';

    try{
      const r = await apiFetch('/api/admin/covers',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          productId:item.productId,
          coverMode:'steam',
          coverAppId:div.querySelector('[data-k="coverAppId"]').value.trim(),
          coverUrl:'',
          coverSource:'steam'
        })
      });
      const data = await r.json();
      if(!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);
      Object.assign(item,data.item);
      status.textContent = 'Возвращено на Steam.';
      status.className = 'status ok';
      setTimeout(load, 250);
    }catch(e){
      if(e.message !== 'Unauthorized'){
        status.textContent = e.message;
        status.className = 'status err';
      }
    }
  };

  div.querySelector('[data-action="saved"]').onclick = () => openLibrary(div,item);

  div.querySelector('[data-action="picker"]').onclick = () => openPicker(div,item);

  div.querySelector('[data-action="preview"]').onclick = () => {
    const current = readCard(div,item);
    const url = coverEndpoint(current);
    div.querySelector('img').src = url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();
  };

  div.querySelector('[data-action="save"]').onclick = async () => {
    const current = readCard(div,item);
    const status = div.querySelector('.status');
    status.textContent = 'Сохраняю…';
    status.className = 'status';

    try{
      const r = await apiFetch('/api/admin/covers',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          productId:item.productId,
          coverMode:current.coverMode,
          coverAppId:current.coverAppId,
          coverUrl:current.coverUrl,
          coverSource: current.coverMode === 'custom' ? (item.coverSource || 'url') : 'steam'
        })
      });
      const data = await r.json();
      if(!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);

      Object.assign(item,data.item);
      status.textContent = 'Сохранено';
      status.className = 'status ok';

      const url = coverEndpoint(item);
      div.querySelector('img').src = url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();
    }catch(e){
      if(e.message !== 'Unauthorized'){
        status.textContent = e.message;
        status.className = 'status err';
      }
    }
  };

  return div;
}

function readCard(div,item){
  return {
    ...item,
    coverMode:div.querySelector('[data-k="coverMode"]').value,
    coverAppId:div.querySelector('[data-k="coverAppId"]').value.trim(),
    coverUrl:div.querySelector('[data-k="coverUrl"]').value.trim()
  };
}

function render(){
  const g = document.querySelector('#grid');
  g.innerHTML = '';
  for(const item of items.filter(visible)) g.appendChild(card(item));
}

async function load(){
  const g = document.querySelector('#grid');
  g.innerHTML = '<div class="muted">Загрузка…</div>';

  try{
    const r = await apiFetch('/api/admin/covers');
    const data = await r.json();
    if(!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);

    items = data.items || [];
    showAdmin();
    render();
  }catch(e){
    if(e.message !== 'Unauthorized'){
      g.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
    }
  }
}

document.querySelector('#loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();

  const username = document.querySelector('#username').value;
  const password = document.querySelector('#password').value;
  const status = document.querySelector('#loginStatus');
  const button = document.querySelector('#loginButton');

  status.textContent = 'Вхожу…';
  status.className = 'status';
  button.disabled = true;

  try{
    const r = await fetch(API + '/api/admin/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password})
    });

    const data = await r.json();
    if(!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);

    token = data.token;
    sessionStorage.setItem(TOKEN_KEY, token);
    document.querySelector('#password').value = '';
    status.textContent = '';

    await load();
  }catch(e){
    status.textContent = e.message;
    status.className = 'status err';
  }finally{
    button.disabled = false;
  }
});

document.querySelector('#logout').addEventListener('click', async () => {
  try{
    if(token){
      await fetch(API + '/api/admin/logout',{
        method:'POST',
        headers:{Authorization:`Bearer ${token}`}
      });
    }
  }catch(_){}

  showLogin('');
});

document.querySelector('#q').addEventListener('input',render);
document.querySelector('#filter').addEventListener('change',render);
document.querySelector('#reload').onclick=load;

async function saveDirectSteamMatch(item, target, button, card){
  const oldText = button.textContent;
  button.disabled = true;
  button.textContent = 'Сохраняю…';

  try{
    const r = await apiFetch('/api/admin/set-steam-match',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        productId:item.productId,
        steamType:target.type,
        steamId:target.steamId,
        coverAppId:target.coverAppId || ''
      })
    });
    const saved = await r.json();
    if(!r.ok || !saved.ok) throw new Error(saved.error || `HTTP ${r.status}`);

    button.textContent = 'Готово';
    const status = document.querySelector('#syncStatus');
    status.textContent = `Привязано: ${item.name} → ${saved.item.type} ${saved.item.steamId}.`;
    card.remove();
    await load();
  }catch(e){
    button.disabled = false;
    button.textContent = oldText;
    alert(e.message);
  }
}

function drawSteamCandidates(item, data, host, card){
  host.innerHTML = '';

  if(data.baseApp?.appId){
    const base = document.createElement('div');
    base.className = 'muted';
    base.textContent = `Базовая игра: ${data.baseApp.name} · AppID ${data.baseApp.appId}${data.baseApp.clear ? ' · уверенное совпадение' : ' · требуется проверка'}`;
    host.appendChild(base);
  }

  const candidates = Array.isArray(data.candidates) ? data.candidates : [];
  if(!candidates.length){
    const empty = document.createElement('div');
    empty.className = 'muted';
    empty.textContent = 'Подходящих вариантов Steam не найдено. Можно указать AppID или Package/SubID вручную ниже.';
    host.appendChild(empty);
    return;
  }

  for(const c of candidates){
    const recommended = Boolean(c.editionMatch && c.exactBase && !c.suspicious && Number(c.confidence) >= .999);
    const row = document.createElement('div');
    row.className = `steam-result ${recommended ? 'recommended' : ''}`;

    const appNames = Array.isArray(c.apps)
      ? c.apps.slice(0,4).map(x => x.name || `App ${x.id}`).filter(Boolean).join(' + ')
      : '';
    const score = Number(c.confidence ?? c.score ?? 0);
    const scoreText = Number.isFinite(score) ? `${Math.round(score * 100)}%` : '';

    row.innerHTML = `
      <div>
        <strong>${escapeHtml(c.name || `${c.type} ${c.steamId}`)}</strong>
        ${recommended ? `<small class="confidence">Рекомендуется · ${escapeHtml(scoreText || '100%')}</small>` : ''}
        <small>${escapeHtml(c.type === 'package' ? 'Package/SubID' : 'AppID')} ${escapeHtml(c.steamId)}${scoreText && !recommended ? ` · совпадение ${escapeHtml(scoreText)}` : ''}</small>
        ${c.optionText ? `<small>${escapeHtml(c.optionText)}</small>` : ''}
        ${appNames ? `<small>Состав: ${escapeHtml(appNames)}</small>` : ''}
        ${c.suspicious ? `<small class="badText">Похоже на upgrade/soundtrack/служебный пакет — проверь вручную.</small>` : ''}
      </div>
      <button class="${recommended ? 'primary' : ''}">Привязать</button>
    `;

    row.querySelector('button').onclick = () => saveDirectSteamMatch(item,{
      type:c.type === 'package' ? 'package' : 'app',
      steamId:String(c.steamId),
      coverAppId:String(c.coverAppId || '')
    },row.querySelector('button'),card);

    host.appendChild(row);
  }
}

function renderSyncDetails(data){
  const box = document.querySelector('#syncDetails');
  const unresolved = Array.isArray(data.unresolved) ? data.unresolved : [];
  const ignored = Array.isArray(data.ignored) ? data.ignored : [];

  box.innerHTML = '';

  if(!unresolved.length && !ignored.length){
    box.classList.add('hidden');
    return;
  }

  box.classList.remove('hidden');

  if(ignored.length){
    const note = document.createElement('div');
    note.className = 'sync-item';
    note.innerHTML = `<h3>Игнорируются как неигровые услуги: ${ignored.length}</h3>` +
      ignored.map(x => `<div class="muted">${escapeHtml(x.name)} · Product ID ${escapeHtml(x.productId)}</div>`).join('');
    box.appendChild(note);
  }

  for(const item of unresolved){
    const el = document.createElement('div');
    el.className = 'sync-item';

    const candidates = Array.isArray(item.candidates) ? item.candidates : [];
    const editionTag = item.edition?.tag || '';
    el.innerHTML = `
      <h3>${escapeHtml(item.name)}</h3>
      <div class="muted">Product ID ${escapeHtml(item.productId)}</div>
      <div class="muted">Нормализовано: ${escapeHtml(item.normalizedName || '')}${editionTag ? ` · издание: ${escapeHtml(editionTag)}` : ''}</div>
      <div class="sync-candidates"></div>
      <div class="steam-tools">
        <div class="steam-tools-head">
          <strong>Поиск Steam</strong>
          <button data-action="steamSearch">Найти AppID / Package</button>
        </div>
        <div data-k="steamResults" class="steam-results"><div class="muted">Для Deluxe / Definitive / Ultimate и других изданий админка проверит пакеты базовой игры.</div></div>
        <div class="steam-manual">
          <select data-k="manualType">
            <option value="app">AppID</option>
            <option value="package">Package / SubID</option>
          </select>
          <input data-k="manualId" inputmode="numeric" placeholder="Steam ID">
          <input class="wide" data-k="manualCoverAppId" inputmode="numeric" placeholder="coverAppId для Package (необязательно)">
          <button data-action="inspectSteam">Проверить</button>
          <button class="primary" data-action="saveSteam" disabled>Сохранить</button>
          <div data-k="steamPreview" class="steam-preview">Ручной режим — запасной вариант, если автоматический поиск не нашёл нужное издание.</div>
        </div>
      </div>
    `;

    const list = el.querySelector('.sync-candidates');
    if(!candidates.length){
      list.innerHTML = `<div class="muted">Исторических кандидатов не найдено.</div>`;
    }else{
      const historyTitle = document.createElement('div');
      historyTitle.className = 'muted';
      historyTitle.textContent = 'Кандидаты из истории:';
      list.appendChild(historyTitle);

      for(const c of candidates){
        const row = document.createElement('div');
        row.className = 'sync-candidate';
        row.innerHTML = `
          <div>
            <strong>${escapeHtml(c.knownTitle)}</strong>
            <small>
              Product ${escapeHtml(c.oldProductId)} → ${escapeHtml(c.type)} ${escapeHtml(c.steamId)}
              · score ${escapeHtml(c.score)}
              ${c.exactNormalized ? ' · точное нормализованное совпадение' : ''}
            </small>
          </div>
          <button ${c.editionCompatible ? '' : 'disabled'}>Привязать</button>
        `;

        row.querySelector('button').onclick = async () => {
          const btn = row.querySelector('button');
          btn.disabled = true;
          btn.textContent = 'Сохраняю…';

          try{
            const r = await apiFetch('/api/admin/apply-match-candidate',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({
                productId:item.productId,
                sourceProductId:c.oldProductId
              })
            });
            const saved = await r.json();
            if(!r.ok || !saved.ok) throw new Error(saved.error || `HTTP ${r.status}`);

            btn.textContent = 'Готово';
            el.remove();
            await load();
          }catch(e){
            btn.disabled = false;
            btn.textContent = 'Ошибка';
            alert(e.message);
          }
        };

        list.appendChild(row);
      }
    }

    const steamResults = el.querySelector('[data-k="steamResults"]');
    const steamSearchBtn = el.querySelector('[data-action="steamSearch"]');
    steamSearchBtn.onclick = async () => {
      steamSearchBtn.disabled = true;
      steamSearchBtn.textContent = 'Ищу…';
      steamResults.innerHTML = '<div class="muted">Ищу базовую игру и доступные Steam-пакеты…</div>';
      try{
        const r = await apiFetch('/api/admin/steam-match-candidates?productId=' + encodeURIComponent(item.productId));
        const found = await r.json();
        if(!r.ok || !found.ok) throw new Error(found.error || `HTTP ${r.status}`);
        drawSteamCandidates(item,found,steamResults,el);
      }catch(e){
        steamResults.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
      }finally{
        steamSearchBtn.disabled = false;
        steamSearchBtn.textContent = 'Найти AppID / Package';
      }
    };

    const manualType = el.querySelector('[data-k="manualType"]');
    const manualId = el.querySelector('[data-k="manualId"]');
    const manualCover = el.querySelector('[data-k="manualCoverAppId"]');
    const inspectBtn = el.querySelector('[data-action="inspectSteam"]');
    const saveBtn = el.querySelector('[data-action="saveSteam"]');
    const preview = el.querySelector('[data-k="steamPreview"]');
    let verifiedTarget = null;

    const invalidateManual = () => {
      verifiedTarget = null;
      saveBtn.disabled = true;
    };
    manualType.onchange = invalidateManual;
    manualId.oninput = invalidateManual;
    manualCover.oninput = invalidateManual;

    inspectBtn.onclick = async () => {
      const steamId = manualId.value.trim();
      if(!/^\d+$/.test(steamId)){
        preview.innerHTML = '<span class="err">Введи числовой Steam ID.</span>';
        return;
      }

      inspectBtn.disabled = true;
      preview.textContent = 'Проверяю Steam…';
      invalidateManual();

      try{
        const qs = new URLSearchParams({
          productId:String(item.productId),
          steamType:manualType.value,
          steamId,
          coverAppId:manualCover.value.trim()
        });
        const r = await apiFetch('/api/admin/inspect-steam-target?' + qs.toString());
        const checked = await r.json();
        if(!r.ok || !checked.ok) throw new Error(checked.error || `HTTP ${r.status}`);

        verifiedTarget = checked.target;
        const apps = Array.isArray(checked.target.apps)
          ? checked.target.apps.slice(0,6).map(x => `${x.name || 'App'} (${x.id})`).join(', ')
          : '';
        preview.innerHTML = `<strong>${escapeHtml(checked.target.name)}</strong> · ${escapeHtml(checked.target.type)} ${escapeHtml(checked.target.steamId)}` +
          (checked.target.coverAppId ? ` · coverAppId ${escapeHtml(checked.target.coverAppId)}` : '') +
          (apps ? `<br>Состав: ${escapeHtml(apps)}` : '');
        saveBtn.disabled = false;
      }catch(e){
        preview.innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`;
      }finally{
        inspectBtn.disabled = false;
      }
    };

    saveBtn.onclick = () => {
      if(!verifiedTarget) return;
      saveDirectSteamMatch(item,verifiedTarget,saveBtn,el);
    };

    box.appendChild(el);
  }
}

document.querySelector('#syncDigiseller').onclick = async () => {
  const el = document.querySelector('#syncStatus');
  el.textContent = 'Синхронизация…';

  try{
    const r = await apiFetch('/api/admin/sync-digiseller',{method:'POST'});
    const data = await r.json();
    if(!r.ok || !data.ok) throw new Error((data.errors || []).join(', ') || `HTTP ${r.status}`);

    el.textContent =
      `Готово: из истории ${data.inherited || 0}, Steam App ${data.steamSearchMatched || 0}, ` +
      `Steam Package ${data.steamPackageMatched || 0}, ` +
      `игнорируется ${Array.isArray(data.ignored) ? data.ignored.length : 0}, ` +
      `не определено ${Array.isArray(data.unresolved) ? data.unresolved.length : 0}.`;

    renderSyncDetails(data);
    await load();
  }catch(e){
    if(e.message !== 'Unauthorized') el.textContent = `Ошибка: ${e.message}`;
  }
};

if(token){
  load();
}else{
  showLogin('');
}
