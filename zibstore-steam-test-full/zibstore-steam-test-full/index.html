<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ЗибСтор — тест Steam цен</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background:#11100f; color:#f3eee7; }
    main { max-width: 980px; margin:0 auto; padding:48px 20px; }
    h1 { margin:0 0 8px; font-size:34px; }
    .sub { color:#a89d91; margin-bottom:28px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
    .card { background:#1b1714; border:1px solid #2b2520; border-radius:16px; padding:20px; }
    .name { font-weight:700; line-height:1.35; min-height:56px; }
    .price { font-size:28px; color:#fbbb43; font-weight:800; margin:16px 0 8px; }
    .steam { color:#d5cfc7; line-height:1.55; }
    .fx-line { display:inline-flex; align-items:center; gap:6px; color:#66d18f; }
    .fx-help { position:relative; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border:1px solid #4b6e59; border-radius:50%; font-size:11px; color:#8fe0aa; cursor:help; }
    .fx-help:hover::after { content: attr(data-tooltip); position:absolute; left:0; top:22px; z-index:10; width:250px; padding:10px 12px; border:1px solid #3a332d; border-radius:10px; background:#0f0e0d; color:#d8d1c7; font-size:12px; line-height:1.45; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    .fx-help:hover::before { content:''; position:absolute; left:6px; top:18px; width:8px; height:8px; background:#0f0e0d; border-left:1px solid #3a332d; border-top:1px solid #3a332d; transform:rotate(45deg); z-index:11; }
    .steam-link { color:#66d18f; word-break:break-all; }
    .meta { color:#8e8378; font-size:13px; margin-top:12px; }
    .ok { color:#66d18f; }
    .bad { color:#f07a65; }
    .raw { margin-top:14px; border-top:1px solid #2b2520; padding-top:12px; }
    pre { overflow:auto; background:#0c0b0a; border-radius:10px; padding:12px; font-size:12px; color:#cfc6bc; }
    button { margin-top:22px; border:0; border-radius:10px; padding:12px 18px; font-weight:700; cursor:pointer; background:#fbbb43; color:#17120d; }
  </style>
</head>
<body>
<main>
  <h1>ЗибСтор — тест Steam цен</h1>
  <div class="sub">Отдельный стенд для проверки Netlify Function → Steam → ЦБ → RUB.</div>
  <div class="grid">
    <section class="card">
      <div class="name">DOOM: The Dark Ages Premium</div>
      <div class="meta">Digiseller: 1 986 ₽ · Steam package 1221725</div>
      <div id="doom" class="steam">Загрузка…</div>
      <div class="raw"><pre id="doomRaw">—</pre></div>
    </section>
    <section class="card">
      <div class="name">Assassin's Creed Black Flag Resynced</div>
      <div class="meta">Digiseller: 3 163 ₽ · Steam AppID 3751950</div>
      <div id="ac" class="steam">Загрузка…</div>
      <div class="raw"><pre id="acRaw">—</pre></div>
    </section>
  </div>
  <button id="reload">Проверить ещё раз</button>
</main>
<script>
const fmt = n => Number(n).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
const tests = [
  { key:'doom', el:'doom', raw:'doomRaw', type:'package', id:'1221725', our:1986 },
  { key:'ac', el:'ac', raw:'acRaw', type:'app', id:'3751950', our:3163 }
];
async function runTest(t) {
  const el = document.getElementById(t.el);
  const raw = document.getElementById(t.raw);
  el.className = 'steam';
  el.textContent = 'Загрузка…';
  raw.textContent = '—';
  try {
    const p = new URLSearchParams({ [t.type === 'package' ? 'packageid' : 'appid']: t.id, cc:'kz' });
    const res = await fetch('/.netlify/functions/steam-price?' + p.toString(), { cache:'no-store' });
    const data = await res.json();
    raw.textContent = JSON.stringify(data, null, 2);
    if (!data.available) {
      el.classList.add('bad');
      el.textContent = 'Steam: цена недоступна\n' + (data.error || data.reason || 'неизвестная ошибка');
      return;
    }
    const steamRub = Number(data.final_rub);
    const cheaper = t.our < steamRub;
    const diff = cheaper
      ? Math.round((1 - t.our / steamRub) * 100)
      : Math.round((1 - steamRub / t.our) * 100);
    const relation = cheaper ? `ЗибСтор дешевле на ${fmt(diff)}%` : `ЗибСтор дороже на ${fmt(diff)}%`;
    const label = t.type === 'package' ? 'Steam-набор' : 'Steam-игра';
    const fxRate = data.fx?.rate ?? '—';
    const fxDate = data.fx?.date ? new Date(data.fx.date).toLocaleDateString('ru-RU') : '—';
    const fxTooltip = `Пересчёт выполнен из ${data.currency} в RUB по официальному курсу ЦБ РФ. Использован курс ${fxRate} ₽ за 1 ${data.currency}; дата публикации курса: ${fxDate}.`;
    el.classList.add('ok');
    el.innerHTML = `${label}: ${fmt(data.final)} ${data.currency}<br>` +
      `≈ ${fmt(steamRub)} ₽ <span class="fx-line">по курсу ЦБ РФ <span class="fx-help" data-tooltip="${fxTooltip.replace(/\"/g, '&quot;')}">?</span></span><br>` +
      `Digiseller: ${fmt(t.our)} ₽<br>` +
      `<span class="steam-link">Steam: ${data.steam_url || ''}</span><br>` +
      `<strong>${relation}</strong>`;
  } catch (e) {
    el.classList.add('bad');
    el.textContent = 'Ошибка запроса: ' + e.message;
  }
}
async function runAll() { await Promise.all(tests.map(runTest)); }
document.getElementById('reload').addEventListener('click', runAll);
runAll();
</script>
</body>
</html>
